# Mod metadata: id, version, authors, dependencies.

modLoader = "javafml"
loaderVersion = "[46,)"
license = "MIT"

[[mods]]
modId = "stackablepotionsplus"
version = "${version}"
displayName = "Stackable Potions Plus"
logoFile = "icon.png"
authors = "Lingyao-cangxuan"
credits = "基于 CursedFlames 的 Stackable Potions（MIT 许可）- https://modrinth.com/mod/stackablepotions"
description = '''
原版药水（普通 / 喷溅 / 滞留）堆叠上限提升至 64 瓶。
喷溅与滞留药水的 1 秒使用冷却可关闭（默认已关闭）。
重复获得同一种药水效果时：时长累加、等级逐级提升，上限可配置。
支持无限时长、负面效果叠加、瞬间效果连发增强（均默认关闭）。
背包效果面板中，10 级以上的效果改用数字显示。
'''
